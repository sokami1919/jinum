<style>
  :root{
    color-scheme: dark;
    --bg:#120e09; --bg-deep:#0b0805;
    --surface:#1f1912; --surface-alt:#292017; --surface-raised:#2e2418;
    --text:#f6f0e2; --dim:#bcab8f; --faint:#8f8069;
    --border:#3d3020; --border-soft:#2d2317;
    --accent:#c9a86a; --accent-bright:#e8c988; --accent-deep:#9a7d43; --accent-ink:#171208;
    --seal:#b23a2e; --seal-deep:#8c2b21; --good:#a8c686;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; color:var(--text);
    font-family:"Noto Serif SC","Noto Serif JP","Noto Serif KR","Songti SC","STSong",serif;
    background:
      radial-gradient(ellipse 120% 50% at 50% -10%, rgba(201,168,106,.07), transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
    background-attachment:fixed; background-color:var(--bg-deep);
    min-height:100vh;
  }
  ::selection{background:rgba(201,168,106,.35)}
  button,[role="button"],select,summary,input:not([type="checkbox"],[type="radio"]){min-height:2.25rem}
  button{font-family:inherit; cursor:pointer; background:none; border:none; color:inherit}
  .font-display{font-family:"Cormorant Garamond","Noto Serif SC","Noto Serif JP","Noto Serif KR",serif; letter-spacing:.01em}

  /* language switcher */
  .langbar{display:flex; justify-content:center; padding:16px 16px 0}
  .langbar nav{display:inline-flex; align-items:center; gap:4px; border-radius:999px; border:1px solid var(--border-soft); background:rgba(31,25,18,.72); padding:4px; box-shadow:0 10px 24px rgba(0,0,0,.35); backdrop-filter:blur(4px)}
  .langbar button{border-radius:999px; padding:6px 14px; font-size:14px; color:var(--dim); transition:background .2s,color .2s; min-height:36px}
  .langbar button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); font-weight:700; box-shadow:0 4px 12px rgba(0,0,0,.3)}

  .brandline{font-size:13px; letter-spacing:.28em; color:var(--accent); text-transform:uppercase}
  .brandline .dot{color:var(--seal)}
  .domainline{margin-top:6px; font-size:12px; letter-spacing:.18em; color:var(--faint)}

  /* candle glow */
  .candle-glow{background:
    radial-gradient(ellipse 90% 42% at 50% -6%, rgba(201,168,106,.22), transparent 65%),
    radial-gradient(ellipse 55% 26% at 50% -2%, rgba(255,190,90,.14), transparent 70%)}
  .glow-orb{position:absolute; left:50%; top:-70px; width:340px; height:340px; transform:translateX(-50%); border-radius:9999px;
    background:radial-gradient(circle, rgba(255,196,96,.20) 0%, rgba(232,163,61,.08) 45%, transparent 70%);
    filter:blur(6px); pointer-events:none; animation:breathe 7s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.65; transform:translateX(-50%) scale(1)}50%{opacity:1; transform:translateX(-50%) scale(1.07)}}
  .flame-halo{position:relative; display:inline-flex}
  .flame-halo::before{content:""; position:absolute; inset:-16px -22px; border-radius:9999px;
    background:radial-gradient(ellipse at 50% 62%, rgba(255,190,90,.28), transparent 65%);
    animation:breathe-plain 5.5s ease-in-out infinite; pointer-events:none}
  @keyframes breathe-plain{0%,100%{opacity:.55; transform:scale(1)}50%{opacity:.95; transform:scale(1.08)}}
  @keyframes flicker{0%,100%{opacity:.62; transform:scaleY(1) rotate(-.6deg)}30%{opacity:.95; transform:scaleY(1.07) rotate(.6deg)}55%{opacity:.74; transform:scaleY(.96) rotate(0deg)}78%{opacity:1; transform:scaleY(1.04) rotate(-.4deg)}}
  .flame{transform-origin:50% 100%; animation:flicker 2.8s ease-in-out infinite; filter:drop-shadow(0 0 9px rgba(255,176,66,.45))}

  /* number sphere */
  .number-sphere-wrap{position:absolute; left:50%; top:47%; transform:translate(-50%,-50%); width:min(86vw,410px); aspect-ratio:1/1; opacity:.6; pointer-events:none}
  .number-sphere-wrap canvas{display:block; width:100%; height:100%}

  /* dust motes */
  .motes{position:absolute; inset:0; overflow:hidden; pointer-events:none}
  .mote{position:absolute; border-radius:9999px; background:radial-gradient(circle, rgba(246,220,160,.85), rgba(246,220,160,0) 70%); animation:drift linear infinite; opacity:0}
  @keyframes drift{0%{transform:translate3d(0,0,0); opacity:0}12%{opacity:.55}55%{opacity:.35}100%{transform:translate3d(14px,-150px,0); opacity:0}}

  /* gate */
  .gate-stage{position:relative; display:flex; flex-direction:column; align-items:center; overflow:hidden; padding:40px 24px 64px; text-align:center; min-height:82vh; transition:opacity .38s ease, transform .38s ease, filter .38s ease}
  .gate-leaving{opacity:0; transform:translateY(18px) scale(.985); filter:blur(3px); pointer-events:none}
  .gate-heroes{position:relative; margin-top:36px; display:flex; flex-direction:column; gap:20px}
  .gate-heroes h1{margin:0; line-height:1.35; font-weight:500; font-size:18px; color:var(--faint)}
  .gate-heroes h1.current{font-size:36px; font-weight:900; color:var(--text); text-shadow:0 2px 24px rgba(201,168,106,.35)}
  .bell-btn{position:relative; margin-top:-4px; display:flex; flex-direction:column; align-items:center; touch-action:none; padding:8px 24px}
  .bell-ring{position:absolute; top:12px; width:96px; height:96px; border-radius:9999px; border:1px solid rgba(201,168,106,.4); animation:ring-pulse 5.2s ease-in-out infinite}
  @keyframes ring-pulse{0%,100%{opacity:.35; transform:scale(1)}50%{opacity:.7; transform:scale(1.05)}}
  .bell-sway{transform-origin:50% -6px; animation:sway 5.2s ease-in-out infinite; filter:drop-shadow(0 6px 16px rgba(201,168,106,.35))}
  @keyframes sway{0%,100%{transform:rotate(-2.4deg)}50%{transform:rotate(2.4deg)}}
  .bell-stem{width:1px; height:56px; background:linear-gradient(180deg, transparent, var(--accent))}
  .gate-hint{margin-top:12px; font-size:16px; font-weight:700; letter-spacing:.2em; color:var(--accent)}
  .gate-note{position:relative; margin-top:40px; max-width:24rem; font-size:12px; line-height:1.7; color:var(--faint)}

  .ornament{display:flex; align-items:center; gap:10px}
  .ornament-line{height:1px; width:40px; background:linear-gradient(90deg, transparent, rgba(201,168,106,.55), transparent)}
  .ornament-line.flex{flex:1; width:auto}
  .ornament-diamond{width:7px; height:7px; transform:rotate(45deg); background:var(--accent); box-shadow:0 0 8px rgba(201,168,106,.6); flex-shrink:0}

  /* flow header */
  .flow-head{position:relative; overflow:hidden; padding:24px 20px 32px}
  .flow-inner{position:relative; max-width:36rem; margin:0 auto; display:flex; flex-direction:column; align-items:center; text-align:center}
  .flow-inner h1{margin:12px 0 0; font-size:26px; font-weight:900; line-height:1.4; text-shadow:0 2px 20px rgba(201,168,106,.3)}
  .intro{margin:12px 0 0; max-width:28rem; font-size:14px; line-height:1.75; color:var(--dim)}
  .digits{display:flex; align-items:flex-end; gap:10px; margin-top:24px}
  .digit-box{width:56px; height:68px; border-radius:12px; border:1px solid var(--border); text-align:center;
    font-family:"Cormorant Garamond","Noto Serif SC",serif; font-size:32px; font-weight:700; color:var(--text);
    caret-color:var(--accent); background:linear-gradient(180deg, var(--surface-alt), var(--surface));
    box-shadow:inset 0 2px 6px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.25);
    transition:border-color .2s, box-shadow .2s, transform .15s}
  @media(min-width:640px){.digit-box{width:60px}}
  .digit-box:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(201,168,106,.25), 0 0 18px rgba(201,168,106,.18); outline:none; transform:translateY(-2px)}
  .digit-box.filled{border-color:rgba(201,168,106,.65); color:var(--accent-bright); box-shadow:inset 0 2px 6px rgba(0,0,0,.35), 0 0 14px rgba(201,168,106,.14)}
  .btn-primary{background:linear-gradient(180deg, var(--accent-bright) 0%, var(--accent) 55%, var(--accent-deep) 130%);
    box-shadow:0 10px 24px rgba(154,125,67,.35), inset 0 1px 0 rgba(255,246,220,.55);
    transition:transform .18s, opacity .18s; color:var(--accent-ink)}
  .btn-primary:not(:disabled):active{transform:scale(.98)}
  .btn-primary:disabled{opacity:.4; cursor:default}
  .btn-begin{margin-top:24px; width:100%; max-width:24rem; border-radius:999px; padding:14px 24px; font-size:18px; font-weight:700}
  .fill-hint{margin-top:8px; font-size:12px; color:var(--faint)}
  .err-msg{margin-top:12px; font-size:14px; color:#e88a7a}
  .only-note{margin-top:16px; max-width:28rem; font-size:12px; line-height:1.7; color:var(--faint)}

  /* slogan block — before the number input */
  .intro-block{margin-top:28px; width:100%; max-width:32rem; text-align:center; border:1px solid var(--border);
    background:linear-gradient(180deg, var(--surface-raised) 0%, var(--surface) 60%);
    box-shadow:0 10px 28px rgba(0,0,0,.35), inset 0 1px 0 rgba(246,240,226,.05); border-radius:16px; padding:22px 20px}
  @media(min-width:640px){.intro-block{padding:26px 24px}}
  .slogan-main{margin:14px 0 0; font-size:23px; font-weight:900; line-height:1.55; color:var(--accent-bright);
    text-shadow:0 2px 18px rgba(201,168,106,.30); letter-spacing:.02em}
  @media(min-width:640px){.slogan-main{font-size:25px}}
  .slogan-sub{margin:10px 0 0; font-size:15px; line-height:1.75; color:var(--dim)}

  .loader{margin-top:28px; display:flex; flex-direction:column; align-items:center}
  .loader-orb{position:relative; width:64px; height:64px; display:flex; align-items:center; justify-content:center}
  .loader-ring{position:absolute; inset:0; border-radius:9999px; border:1px solid rgba(201,168,106,.55); animation:ring-expand 1.8s ease-out infinite}
  @keyframes ring-expand{0%{transform:scale(.55); opacity:.8}100%{transform:scale(1.6); opacity:0}}
  .shimmer-track{position:relative; overflow:hidden; height:14px; border-radius:999px; background:var(--surface-alt)}
  .shimmer-track::after{content:""; position:absolute; inset:0; width:45%; background:linear-gradient(90deg, transparent, rgba(232,201,136,.13), transparent); animation:shimmer-slide 1.6s ease-in-out infinite}
  @keyframes shimmer-slide{from{transform:translateX(-100%)}to{transform:translateX(240%)}}

  /* results */
  main.results{max-width:36rem; margin:0 auto; padding:0 20px 40px; scroll-margin-top:16px}
  .card{background:linear-gradient(180deg, var(--surface-raised) 0%, var(--surface) 55%); border:1px solid var(--border);
    box-shadow:0 10px 28px rgba(0,0,0,.35), inset 0 1px 0 rgba(246,240,226,.05); border-radius:16px; padding:20px}
  @media(min-width:640px){.card{padding:24px}}
  .verdict-card{background:radial-gradient(ellipse 80% 60% at 18% 0%, rgba(201,168,106,.12), transparent 60%), linear-gradient(180deg, var(--surface-raised) 0%, var(--surface) 60%);
    border:1px solid var(--border); box-shadow:0 12px 30px rgba(0,0,0,.38), inset 0 1px 0 rgba(246,240,226,.06); border-radius:16px; padding:20px}
  @media(min-width:640px){.verdict-card{padding:24px}}
  .verdict-flex{display:flex; align-items:flex-start; gap:16px}
  .seal-badge{display:inline-flex; min-height:64px; min-width:64px; flex-shrink:0; transform:rotate(3deg); align-items:center; justify-content:center;
    border-radius:8px; padding:8px; text-align:center; font-size:16px; font-weight:900; line-height:1.3; color:#f5efe3; background:var(--seal);
    box-shadow:0 8px 20px rgba(0,0,0,.45), inset 0 0 0 1.5px rgba(246,240,226,.22), inset 0 0 14px rgba(0,0,0,.25)}
  .seal-badge.bad{background:#6e4a2f}
  @media(max-width:639px){.verdict-flex{flex-direction:column; gap:10px}.seal-badge{min-height:0; min-width:0; padding:6px 14px; font-size:14px; align-self:flex-start}}
  .verdict-kicker{font-size:12px; letter-spacing:.15em; color:var(--faint); margin:0}
  .verdict-phrase{margin:4px 0 0; font-size:24px; font-weight:700; line-height:1.4}
  .verdict-summary{margin:8px 0 0; font-size:14px; line-height:1.75; color:var(--dim)}

  .bundle-card{margin-top:20px; border:1px solid transparent; border-radius:16px; padding:20px;
    background:linear-gradient(180deg, #322619 0%, var(--surface-alt) 60%) padding-box, linear-gradient(160deg, var(--accent-bright), var(--accent-deep) 55%, rgba(178,58,46,.65)) border-box;
    box-shadow:0 14px 34px rgba(0,0,0,.4), 0 0 0 1px rgba(201,168,106,.08), 0 0 34px rgba(201,168,106,.10)}
  @media(min-width:640px){.bundle-card{padding:24px}}
  .bundle-head{display:flex; align-items:center; gap:12px}
  .bundle-head h3{margin:0; font-size:20px; font-weight:700}
  .bundle-desc{margin:8px 0 0; font-size:14px; line-height:1.75; color:var(--dim)}
  .bundle-inc{margin:4px 0 0; font-size:12px; color:var(--faint)}
  .bundle-price{margin:12px 0 0; font-size:24px; font-weight:900; color:var(--accent); line-height:1.4}
  .btn-seal{background:linear-gradient(180deg, #c44a3a 0%, var(--seal) 55%, var(--seal-deep) 130%);
    box-shadow:0 10px 22px rgba(140,43,33,.38), inset 0 1px 0 rgba(255,226,214,.35); transition:transform .18s; color:#fff}
  .btn-seal:active{transform:scale(.98)}
  .btn-bundle{margin-top:12px; width:100%; border-radius:999px; padding:12px 20px; font-size:16px; font-weight:700; min-height:48px}

  .section-head{margin-top:32px; display:flex; align-items:center; gap:12px}
  .section-head h3{margin:0; font-size:20px; font-weight:700}
  .aspects{margin-top:12px; display:flex; flex-direction:column; gap:12px}
  .aspect-head{display:flex; align-items:center; justify-content:space-between; gap:12px}
  .aspect-head h4{margin:0; display:flex; align-items:baseline; gap:10px; font-size:18px; font-weight:700}
  .aspect-num{font-size:14px; font-weight:600; letter-spacing:.08em; color:var(--accent-deep)}
  .aspect-num.seal-num{color:var(--seal)}
  .tag{flex-shrink:0; border-radius:999px; padding:4px 10px; font-size:12px; font-weight:500; border:1px solid var(--border); color:var(--dim)}
  .brief{margin:6px 0 0; font-size:14px; line-height:1.75}
  .ln-note{margin:8px 0 0; font-size:12px; color:var(--faint); line-height:1.7}
  .btn-ghost-gold{border:1px solid var(--accent); color:var(--accent); border-radius:999px; padding:8px 16px; font-size:14px; font-weight:500; margin-top:12px; min-height:40px; transition:background .2s, transform .18s}
  .btn-ghost-gold:active{transform:scale(.98)}
  @media(hover:hover){.btn-ghost-gold:hover{background:rgba(201,168,106,.10)} .card-hover{transition:transform .25s, border-color .25s, box-shadow .25s} .card-hover:hover{transform:translateY(-2px); border-color:rgba(201,168,106,.55)}}
  .ln-diamond{width:8px; height:8px; flex-shrink:0; transform:rotate(45deg); background:var(--seal); box-shadow:0 0 8px rgba(178,58,46,.7); align-self:center}

  /* coming-soon notice (replaces any payment panel) */
  .notice{margin-top:12px; border-radius:12px; border:1px solid var(--border); background:rgba(11,8,5,.45); padding:16px; animation:fade-up .35s cubic-bezier(.22,.8,.32,1) both}
  .notice h5{margin:0; font-size:15px; font-weight:700; color:var(--accent)}
  .notice p{margin:6px 0 0; font-size:13px; line-height:1.75; color:var(--dim)}
  .notice .price-line{color:var(--text); font-weight:700}
  .btn-close{margin-top:12px; border:1px solid var(--border); color:var(--dim); border-radius:999px; padding:8px 18px; font-size:14px; min-height:40px}

  .paid-banner{margin-bottom:16px; border:1px solid rgba(168,198,134,.5); background:rgba(168,198,134,.08); color:var(--text); border-radius:12px; padding:14px 16px; font-size:14px; line-height:1.7}
  .recover-input{width:100%; margin-top:10px; border-radius:12px; border:1px solid var(--border); padding:12px 14px; font-size:18px; letter-spacing:.35em; text-align:center; font-family:inherit; color:var(--text); background:linear-gradient(180deg, var(--surface-alt), var(--surface)); box-shadow:inset 0 2px 6px rgba(0,0,0,.35); color-scheme:dark}
  .recover-input:focus, .recover-select:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(201,168,106,.25); outline:none}
  .recover-select{width:100%; margin-top:10px; border-radius:12px; border:1px solid var(--border); padding:12px 14px; font-size:16px; font-family:inherit; color:var(--text); background:linear-gradient(180deg, var(--surface-alt), var(--surface)); color-scheme:dark}
  .recover-label{display:block; margin-top:14px; font-size:13px; font-weight:700; color:var(--dim)}
  .recover-btn{margin-top:16px; width:100%; border-radius:999px; padding:12px 20px; font-size:16px; font-weight:700; min-height:48px}
  .recover-err{margin-top:10px; font-size:13px; color:#e88a7a}
  .paywait{position:fixed; left:50%; bottom:calc(14px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:60; width:min(92vw,26rem);
    border:1px solid rgba(201,168,106,.65); border-radius:16px; padding:16px; text-align:left;
    background:linear-gradient(180deg, #322619 0%, var(--surface) 70%); box-shadow:0 18px 44px rgba(0,0,0,.6), 0 0 30px rgba(201,168,106,.18)}
  .paywait h5{margin:0; font-size:16px; font-weight:700; color:var(--accent-bright)}
  .paywait p{margin:6px 0 0; font-size:13px; line-height:1.75; color:var(--dim)}
  .paywait .recover-btn{margin-top:12px}
  .paywait.flash{animation:paid-pulse 1.4s ease-in-out 2}
  .paywait-dismiss{margin-top:8px; width:100%; font-size:13px; color:var(--faint); min-height:36px}
  .tag.open{border-color:rgba(168,198,134,.55); color:var(--good)}
  .detail-text{margin-top:10px; font-size:14px; line-height:1.85; color:var(--text)}
  .detail-text p{margin:0 0 8px}
  .detail-text .ln-sec-h{margin:12px 0 2px; font-weight:700; color:var(--accent); font-size:13px; letter-spacing:.08em}
  .btn-new{margin-top:24px; width:100%; border-radius:999px; border:1px solid var(--border); padding:12px 20px; font-size:14px; color:var(--dim); min-height:48px}

  /* change-number service */
  .svc-wrap{max-width:36rem; margin:0 auto; padding:0 20px}
  .svc-card{margin-top:24px; border:1px solid transparent; border-radius:16px; padding:20px;
    background:linear-gradient(180deg, #2c2115 0%, var(--surface) 60%) padding-box, linear-gradient(160deg, var(--accent-bright), var(--accent-deep) 55%, rgba(178,58,46,.65)) border-box;
    box-shadow:0 14px 34px rgba(0,0,0,.4), 0 0 34px rgba(201,168,106,.10)}
  @media(min-width:640px){.svc-card{padding:24px}}
  .svc-head{display:flex; align-items:center; gap:12px}
  .svc-head h3{margin:0; font-size:20px; font-weight:700}
  .svc-new{flex-shrink:0; border-radius:999px; padding:4px 10px; font-size:12px; font-weight:700; color:#fff; background:linear-gradient(180deg, #c44a3a, var(--seal-deep))}
  .svc-desc{margin:10px 0 0; font-size:14px; line-height:1.75; color:var(--dim)}
  .svc-price{margin:12px 0 0; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
  .svc-price .amt{font-size:28px; font-weight:900; color:var(--accent); line-height:1.2}
  .svc-price .note{font-size:12px; color:var(--faint)}
  .svc-sub{margin:20px 0 0; font-size:14px; font-weight:700; color:var(--accent)}
  .svc-needs{margin:8px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:6px}
  .svc-needs li{display:flex; gap:8px; font-size:13px; line-height:1.7; color:var(--dim)}
  .svc-needs li::before{content:""; margin-top:8px; width:6px; height:6px; flex-shrink:0; transform:rotate(45deg); background:var(--accent-deep)}
  .svc-delivery{margin:12px 0 0; font-size:14px; line-height:1.75; color:var(--text); font-weight:700}
  .svc-nopromise{margin:6px 0 0; font-size:12px; line-height:1.7; color:var(--faint)}
  .svc-form{margin-top:16px; display:flex; flex-direction:column; gap:14px}
  .svc-field label{display:block; font-size:13px; font-weight:700; color:var(--dim); margin-bottom:6px}
  .svc-input{width:100%; border-radius:12px; border:1px solid var(--border); padding:12px 14px; font-size:16px; font-family:inherit; color:var(--text);
    background:linear-gradient(180deg, var(--surface-alt), var(--surface)); box-shadow:inset 0 2px 6px rgba(0,0,0,.35); color-scheme:dark}
  .svc-input:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(201,168,106,.25); outline:none}
  .svc-toggle{display:flex; overflow:hidden; border-radius:999px; border:1px solid var(--border); box-shadow:inset 0 2px 6px rgba(0,0,0,.3)}
  .svc-toggle button{flex:1; padding:8px 10px; font-size:14px; font-weight:500; background:var(--surface); color:var(--dim); min-height:40px}
  .svc-toggle button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); font-weight:700}
  .btn-svc{width:100%; border-radius:999px; padding:12px 20px; font-size:16px; font-weight:700; min-height:48px}

  footer.rules{max-width:36rem; margin:0 auto; padding:0 20px 40px}
  footer.rules .inner{margin-top:16px; font-size:12px; line-height:1.8; color:var(--faint)}
  footer.rules h2{margin:0; text-align:center; font-size:14px; font-weight:700; letter-spacing:.15em; color:var(--dim)}
  footer.rules .disclaimer{margin:12px 0 0; text-align:center}
  footer.rules ul{margin:12px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px}
  footer.rules li{display:flex; gap:8px}
  footer.rules li::before{content:""; margin-top:8px; width:6px; height:6px; flex-shrink:0; transform:rotate(45deg); background:var(--accent-deep)}

  @keyframes fade-up{from{opacity:0; transform:translateY(14px)}to{opacity:1; transform:translateY(0)}}
  .reveal{opacity:0; animation:fade-up .6s cubic-bezier(.22,.8,.32,1) forwards}
  .fade-in{animation:fade-in-k .5s ease-out both}
  @keyframes fade-in-k{from{opacity:0}to{opacity:1}}
  .flow-enter{animation:fade-up .55s cubic-bezier(.22,.8,.32,1) both}
  .hidden{display:none !important}

  /* sacred geometry background — reading page only, behind all content */
  .langbar{position:relative; z-index:2}
  #flow{position:relative; isolation:isolate}
  #flow>header,#flow>main,#flow>.svc-wrap,#flow>footer{position:relative; z-index:1}
  .sacred-bg{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
    background:
      radial-gradient(ellipse 110% 55% at 50% -8%, rgba(255,255,255,.025), transparent 60%),
      linear-gradient(180deg, #030302 0%, #070503 55%, #030302 100%)}
  .geo-pos{position:absolute; pointer-events:none}
  .geo-pos-main{left:50%; top:330px; width:min(150vw,920px); aspect-ratio:1/1; transform:translate(-50%,-50%)}
  .geo-pos-orbits{left:50%; top:330px; width:min(170vw,1060px); aspect-ratio:1/1; transform:translate(-50%,-50%)}
  .geo-pos-star{right:-18vw; top:980px; width:min(96vw,520px); aspect-ratio:1/1; transform:translateY(-50%)}

  .geo-pos-low{left:-20vw; top:1720px; width:min(90vw,480px); aspect-ratio:1/1; transform:translateY(-50%)}
  @media(min-width:640px){.geo-pos-low{left:-100px}}
  .geo-breathe{width:100%; height:100%; animation:geo-breathe 16s ease-in-out infinite}
  .geo-breathe-slow{width:100%; height:100%; animation:geo-breathe 22s ease-in-out infinite; animation-delay:-8s}
  @keyframes geo-breathe{0%,100%{opacity:.55; transform:scale(1)}50%{opacity:.95; transform:scale(1.045)}}
  .geo-spin{display:block; width:100%; height:100%; animation:geo-spin 240s linear infinite; will-change:transform}
  .geo-spin-rev{display:block; width:100%; height:100%; animation:geo-spin-rev 300s linear infinite; will-change:transform}
  .geo-spin-slow{display:block; width:100%; height:100%; animation:geo-spin 360s linear infinite; will-change:transform}
  @keyframes geo-spin{to{transform:rotate(360deg)}}
  @keyframes geo-spin-rev{to{transform:rotate(-360deg)}}
  .sacred-bg svg{overflow:visible}
  .sacred-bg .wline{fill:none; stroke:#fff; stroke-width:.7}
  .sacred-bg .wline-thin{fill:none; stroke:#fff; stroke-width:.45}
  .sacred-bg .wdot{fill:#fff; stroke:none}
  .geo-symbols{position:absolute; inset:0; color:#fff; font-family:"Cormorant Garamond",serif; animation:geo-sym-fade 18s ease-in-out infinite}
  @keyframes geo-sym-fade{0%,100%{opacity:.35}50%{opacity:.8}}
  .geo-symbols span{position:absolute; line-height:1; opacity:.55}
  .geo-symbols .s-lg{font-size:30px}
  .geo-symbols .s-md{font-size:21px}
  .geo-symbols .s-sm{font-size:15px}

  main.results .card, main.results .bundle-card{scroll-margin-top:24px; scroll-margin-bottom:24px}
  @keyframes paid-pulse{0%,100%{box-shadow:0 0 0 3px rgba(201,168,106,.35), 0 0 26px rgba(201,168,106,.28)}50%{box-shadow:0 0 0 6px rgba(201,168,106,.55), 0 0 44px rgba(201,168,106,.45)}}
  .paid-highlight{opacity:1; outline:2px solid var(--accent-bright); outline-offset:2px; animation:paid-pulse 1.6s ease-in-out 3}
  .closing-note{margin:16px 0 10px;padding:14px 16px;border:1px solid rgba(201,168,106,.45);border-radius:12px;background:rgba(201,168,106,.07);font-size:14px;line-height:1.75}
  @media (prefers-reduced-motion: reduce){
    .flame,.glow-orb,.flame-halo::before,.mote,.bell-sway,.bell-ring,.loader-ring,.shimmer-track::after{animation:none}
    .mote{display:none}
    .reveal,.fade-in,.flow-enter,.notice{animation:none; opacity:1}
    .gate-stage{transition:none}
    .geo-breathe,.geo-breathe-slow,.geo-spin,.geo-spin-rev,.geo-spin-slow,.geo-symbols{animation:none}
    .geo-breathe,.geo-breathe-slow{opacity:.5}
    .geo-symbols{opacity:.3}
  }
</style>
</head>
<body>

<div class="langbar">

<!-- ============ Reading flow ============ -->

function toneBand(tone){ if(tone==="daji"||tone==="ji") return "good"; if(tone==="xiong") return "bad"; return "mixed"; }
function compute(last4, lang){
  var pack = DATA.langs[lang];
  var num = parseInt(last4, 10);
  var idx = ((num % 80) + 80) % 80;
  var tone = DATA.tones[idx];
  var band = toneBand(tone);
  var pairs = [last4.slice(0,2), last4.slice(1,3), last4.slice(2,4)];
  var groups = pairs.map(function(p){ return DATA.pairGroup[p] || null; });
  var aspects = DATA.aspects.map(function(def, i){
    var group = null;
    if(def.firstPair){ group = groups[0]; }
    else {
      for(var k=0;k<groups.length;k++){ if(groups[k] && def.gov.indexOf(groups[k])>=0){ group = groups[k]; break; } }
    }
    var brief;
    if(group){ brief = pack.matrix[group][i] || ""; }
    else {
      var sp = pack.briefSpecial && pack.briefSpecial[def.key] && pack.briefSpecial[def.key][band];
      brief = sp || pack.briefTpl[band].split("{noun}").join(pack.aspectNoun[def.key] || pack.aspectName[def.key]);
    }
    return { key: def.key, name: pack.aspectName[def.key], brief: brief };
  });
  var copy = copyFor(lang, idx);
  var repTail = copy && copy.tail;
  function subTail(text){ if(!text || !repTail || repTail === last4) return text; return String(text).split(repTail).join(last4); }
  var aspects2 = aspects.map(function(a){
    var det = (copy && copy.aspects && copy.aspects[a.key]) || [];
    return { key: a.key, name: a.name, brief: a.brief, detail: det.map(subTail) };
  });
  return {
    last4: last4,
    n: idx,
    verdictLabel: pack.toneLabel[tone],
    verdictBad: band === "bad",
    band: band,
    verdictPhrase: pack.table[idx],
    freeText: copy ? subTail((copy.free && copy.free[0]) || "") : "",
    closingText: copy ? subTail(copy.closing || "") : "",
    aspects: aspects2
  };
}

   fixed after-payment address, currently ...?paid=aspect / ?paid=bundle / ?paid=change — a fixed address cannot embed each buyer's

   recovered from the purchase record saved at checkout and from the
   payment signal the return page broadcasts (see below), NOT from the

    if(hi >= 0) q = q.slice(0, hi);
    var sp = new URLSearchParams(q);
    var p = sp.get("paid");
    if(!p) return null;
    var t = sp.get("t") || sp.get("tail") || sp.get("last4") || "";
    t = String(t).replace(/\D/g, "").slice(0, 4);
    var a = sp.get("a") || sp.get("aspect") || sp.get("key") || sp.get("item") || "";
    a = String(a).replace(/[^a-z]/g, "");
    var known = DATA.aspects.some(function(d){ return d.key === a; });
    return { paid: p, t: /^\d{4}$/.test(t) ? t : "", a: known ? a : "" };
  } catch(e){}
  return null;
}
function readReturnData(){
  var sources = [];
  try { sources.push(window.location.href || ""); } catch(e){}
  try { sources.push(window.location.search || ""); } catch(e){}
  try { sources.push(window.location.hash || ""); } catch(e){}
  /* document.referrer is a plain string, readable even when this page sits
     in a sandboxed frame whose storage and parent window are off-limits:
     when the shell page at ...?paid=aspect&t=8657&a=ganqing loads this
     frame, its full URL is the referrer of the frame's first request. */
  try { sources.push(document.referrer || ""); } catch(e){}
  try { if(window.parent && window.parent !== window) sources.push(window.parent.location.href || ""); } catch(e){}
  try { if(window.top && window.top !== window && window.top !== window.parent) sources.push(window.top.location.href || ""); } catch(e){}
  var bare = null;
  for(var i = 0; i < sources.length; i++){
    var r = returnFromString(sources[i]);
    if(!r) continue;
    if(r.t || r.a) return r;      /* richest source wins */
    if(!bare) bare = r;
  }
  return bare;
}
function readPaidParam(){ var r = readReturnData(); return r ? r.paid : null; }
function clearPaidParam(){
  try { history.replaceState(null, "", window.location.pathname + window.location.hash); } catch(e){}
}
/* Apply a completed purchase: unlock it, rebuild the reading for its
   last 4 digits and land on the bought item, highlighted and open. */
function applyPaidUnlock(type, pending, done){
  loadUnlocked();
  var last4 = (pending && /^\d{4}$/.test(pending.last4 || "")) ? pending.last4 : "";
  if(!last4 && unlocked && /^\d{4}$/.test(unlocked.last4 || "")) last4 = unlocked.last4;
  if(!last4 && report) last4 = report.last4;
  if(!last4){ if(done) done(false); return false; }
  if(pending && LANGS.indexOf(pending.lang) >= 0) lang = pending.lang;
  ensureCopy(lang, function(){
    if(unlocked.last4 !== last4) unlocked = { last4: last4, aspects: {}, bundle: false };
    if(type === "aspect" && pending && pending.key) unlocked.aspects[pending.key] = true;
    if(type === "bundle") unlocked.bundle = true;
    saveUnlocked();
    paidBanner = true;
    hidePayWait();
    digits = last4.split("");
    openFlowDirect();
    report = compute(last4, lang);
    noticeItem = null;
    renderReport();
    var targetId = type === "bundle" ? "card-bundle"
      : (type === "aspect" && pending && pending.key ? "card-" + pending.key : "results");
    scrollHighlight(targetId);
    if(done) done(true);
  });
  return true;
}
var paidHandled = false;
function handlePaidReturn(){
  if(paidHandled) return;
  loadUnlocked();
  var ret = readReturnData();
  if(!ret || !ret.paid) return;
  paidHandled = true;
  var paid = ret.paid;
  hidePayWait();
  var stored = getPending();
  if(stored && stored.type && stored.type !== paid && paid !== "change"){
    /* Trust the return flag for the item type; keep the record's fields. */
    stored = { type: paid, key: stored.key, last4: stored.last4, lang: stored.lang, email: stored.email };
  }
  /* Merge every source of the purchase data: address parameters (?t= /
     ?a=) when present override/fill the stored purchase record. */
  var pending = {
    type: paid,
    key: ret.a || (stored && stored.key) || undefined,
    last4: ret.t || (stored && stored.last4) || "",
    lang: (stored && stored.lang) || lang,
    email: stored && stored.email
  };
  /* Broadcast the purchase to the ORIGINAL checkout tab (still open in
     another tab) so it opens the same item by itself too. */
  var sig = { type: paid, key: pending.key, last4: pending.last4, lang: pending.lang, ts: Date.now() };
  writePaidSignal(sig);
  notifyOpener(sig);
  clearPaidParam();
  if(paid === "aspect" || paid === "bundle"){
    delPending();
    if(applyPaidUnlock(paid, pending)) return;
    /* The return arrived but neither the address nor any store on this
       browser knows the number (e.g. an older ?paid=-only link opened in
       a fresh browser): never send a paying visitor back to the bare
       gate — open the reading flow directly and explain plainly. No form,
       no unlock granted on a bare claim. */
    paidLostReturn = true;
    paidLostType = paid;
    var nav = (navigator.language || "").slice(0, 2);
    if(LANGS.indexOf(nav) >= 0) lang = nav;
    openFlowDirect();
    window.setTimeout(function(){ focusDigit(0); }, 160);
  } else if(paid === "change"){
    delPending();
    openFlowDirect();
    if(pending.email) svcSubmittedEmail = pending.email;
    svcNoticeShown = true;
    renderService();
    window.setTimeout(function(){ $("svcWrap").scrollIntoView({ behavior: reducedMotion() ? "auto" : "smooth", block: "start" }); }, 80);
  }
}

$("gateMotes").innerHTML = motesHTML();
$("flowMotes").innerHTML = motesHTML();

ssDel("jinum_paid_recovery_v1"); /* legacy record from the removed tap-to-unlock recovery */
function syncUnlockFromOtherTab(){
  var before = JSON.stringify(unlocked);
  loadUnlocked();
  if(report && JSON.stringify(unlocked) !== before) renderReport();
}
window.addEventListener("focus", syncUnlockFromOtherTab);
window.addEventListener("storage", syncUnlockFromOtherTab);
handlePaidReturn();
/* The shell around this frame can hand the ?paid= flag over a moment after
   first paint; retry the return check a few times and whenever the visitor
   comes back to this tab. When this tab is the ORIGINAL checkout tab, flash
   the payment panel instead, so one tap on it opens the bought reading. */
[700, 1800, 3500, 7000].forEach(function(ms){ window.setTimeout(handlePaidReturn, ms); });
window.addEventListener("focus", handlePaidReturn);
document.addEventListener("visibilitychange", function(){ if(!document.hidden) handlePaidReturn(); });
window.addEventListener("focus", function(){
  var pw = $("payWait");
  if(pw && !pw.classList.contains("hidden") && pendingMem){
    pw.classList.remove("flash");
    void pw.offsetWidth;
    pw.classList.add("flash");
  }
});
